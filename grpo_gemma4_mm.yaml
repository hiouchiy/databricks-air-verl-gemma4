# =============================================================================
# MULTIMODAL sample: verl GRPO + FSDP2 for Gemma4-26B-A4B (MoE) on 8x H100, using
# IMAGE data (geo3k). Single node.
#
# Differences vs the text-only grpo_gemma4.yaml:
#   - command sets MULTIMODAL=1 → run_grpo.sh installs verl main (0.9.0.dev0) at
#     launch, which adds the Gemma4 vision processor (Gemma4Processor). The v3
#     image's verl 0.7.1 rejects it, and no verl RELEASE (incl. 0.8.0) has it yet.
#   - command sets IMAGE_KEY=images → verl builds multimodal (image) messages.
#   - data points at geo3k (image+math), not text-only gsm8k.
#   - attention stays SDPA (Gemma4 global_head_dim=512 exceeds FA2's 256 limit).
#
# Prereq data: geo3k parquet on the Volume (verl geo3k format with an `images`
# column). Use prep_geo3k_deps.yaml in this repo (or reuse existing geo3k).
#
#   air run --file grpo_gemma4_mm.yaml -p <PROFILE> --watch
# =============================================================================

experiment_name: grpo-gemma4-26b-a4b-mm
mlflow_experiment_directory: /Workspace/Users/__WS_EMAIL__/grpo-gemma4-26b-a4b-mm

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

environment:
  docker_image:
    url: __IMAGE__

code_source:
  type: snapshot
  snapshot:
    root_path: .
    include_paths:
      - run_grpo.sh
      - smoke_test.py

env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: "true"
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN
  RAY_TEMP_DIR: /tmp/ray
  # Disable vLLM's custom all-reduce kernel (falls back to stable NCCL all-reduce).
  # vLLM's custom peer-to-peer all-reduce can fail to init / hang on Gemma4 MoE + H100.
  VLLM_DISABLE_CUSTOM_ALL_REDUCE: "1"
  OPENSSL_FORCE_FIPS_MODE: "0"
  OPENSSL_FIPS: "0"
  # MULTIMODAL: install verl main (Gemma4 vision processor) at launch; use the
  # image column. Both are read by run_grpo.sh.
  MULTIMODAL: "1"
  IMAGE_KEY: images
  # Memory settings for the image path (evidence-based; see verl perf_tuning).
  # geo3k images add a vision tower + many vision tokens. Two distinct OOMs seen:
  #   - run2: OOM at ACTOR UPDATE (gpu_mem=0.6/n=5/1024+1024) → enable activation offload.
  #   - run3: vLLM WORKER died at INIT when gpu_mem lowered to 0.4 (too low for weights+
  #     KV+CUDA-graph capture during profiling) → keep gpu_mem in verl's 0.5-0.7 range
  #     AND disable CUDA-graph capture (enforce_eager) to cut startup memory.
  ROLLOUT_GPU_MEM_UTIL: "0.5"     # verl recommends 0.5-0.7 (0.4 broke vLLM init)
  ENFORCE_EAGER: "True"           # no CUDA-graph capture → lower vLLM startup memory
  ACT_OFFLOAD: "True"             # offload activations → cut actor-update peak memory
  # Must exceed a single image's token count. geo3k image expands to
  # max_tokens_per_mm_item=2496; with chunked MM input disabled, vLLM errors if
  # max_num_batched_tokens < 2496 ("larger than max_num_batched_tokens"). Use 4096
  # (fits an image, still below the 8192 default → smaller warmup footprint).
  MAX_NUM_BATCHED_TOKENS: "4096"
  # Batch/group size is the biggest lever on actor-update peak memory (linear).
  # actor-update OOM'd twice (run2, run5) even with offload; halve the batch/group.
  # Constraint: (train_batch_size * rollout.n) must be divisible by verl's minimal
  # batch, and ppo_mini_batch_size <= train_batch_size. 4 * 2 = 8 (OK).
  TRAIN_BATCH_SIZE: "4"
  PPO_MINI_BATCH: "4"
  ROLLOUT_N: "2"
  MAX_PROMPT_LEN: "768"
  MAX_RESPONSE_LEN: "512"

max_retries: 0
timeout_minutes: 240

# "does it run" smoke: tiny geo3k data + total_training_steps=3.
parameters:
  model_name: google/gemma-4-26B-A4B-it
  train_files: __VOL__/geo3k/train.parquet
  val_files: __VOL__/geo3k/test.parquet
  output_dir: __VOL__/ckpt/grpo-gemma4-26b-a4b-mm
  total_epochs: 1
  total_training_steps: 3

command: |
  cd $CODE_SOURCE_PATH
  bash run_grpo.sh
