# =============================================================================
# The copy at the repo root is a TEMPLATE (it still has placeholders) — do NOT run it directly.
# Run quickstart.sh (or README "Option B") and run the generated copy under gen/ instead.
# リポジトリ直下のものはテンプレートです。直接実行せず、quickstart.sh で生成した gen/ の下のファイルを実行してください。
# （gen/ の下にあるこのファイルは生成済みのコピーなので、そのまま実行して構いません）
#
# PRIMARY sample: verl GRPO + FSDP2 for Gemma4-26B-A4B (MoE), single node 8x H100,
# using the CUSTOM AI Runtime image built in this repo (FROM databricksruntime/air:
# dcs-base-aws-devel-cu13 + verl + vllm 0.24 + transformers >=5.5.3). See
# Dockerfile.
#
# Prereqs:
#   1) Build the image (see Dockerfile header / README).
#   2) Push it to Databricks Artifact Registry (Unity Catalog):
#        databricks air images push --source <local-image> --catalog <c> --schema <s> \
#          --artifact verl-gemma4:<tag> -p <PROFILE>
#   3) Prepare data: prep_gsm8k_deps.yaml (writes tiny text-only gsm8k parquet to the Volume).
#
# Submit:
#   databricks air run --file gen/grpo_gemma4.yaml -p <PROFILE> --watch
#
# Source pattern (MoE + FSDP2): https://github.com/verl-project/verl/blob/main/examples/grpo_trainer/run_qwen3_5_27b_fsdp.sh
# (verl has no Gemma4-specific GRPO script; adapted from the Qwen3.5-27B MoE example.)
# =============================================================================

experiment_name: grpo-gemma4-26b-a4b
mlflow_experiment_directory: /Workspace/Users/__WS_EMAIL__/grpo-gemma4-26b-a4b

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

# --- Custom AI Runtime image (built FROM databricksruntime/air cu13 base), stored in
#     Databricks Artifact Registry as <catalog>.<schema>.<image>:<tag> (no registry host).
#     mutually exclusive with version/dependencies. Code (run_grpo.sh etc.) is
#     baked into the image at /app.
environment:
  unity_catalog_image: __IMAGE__

# Upload only the scripts so the LATEST run_grpo.sh is used (avoids rebuilding the
# 20GB image for a script change). include_paths keeps the 4.3GB ./wheelhouse OUT
# of the snapshot (air uses .gitignore, not .dockerignore, so an unfiltered
# root_path would try to tar+upload the wheelhouse and fail the upload).
code_source:
  type: snapshot
  snapshot:
    root_path: .
    include_paths:
      - run_grpo.sh

# gemma-4-26B-A4B is Apache-2.0 and NOT gated (no HF_TOKEN needed).
env_variables:
  HF_HOME: /tmp/hf
  TOKENIZERS_PARALLELISM: "true"
  NCCL_DEBUG: WARN
  VLLM_LOGGING_LEVEL: WARN
  RAY_TEMP_DIR: /tmp/ray
  # NOTE: vLLM's custom all-reduce is disabled to avoid a Gemma4 CUDA-graph crash,
  # but that is done as a vLLM ENGINE ARG in run_grpo.sh
  # (rollout.engine_kwargs.vllm.disable_custom_all_reduce=True), NOT here — there is
  # no VLLM_DISABLE_CUSTOM_ALL_REDUCE env var in vLLM 0.24 (it would be ignored).
  # opencv-python-headless 5.0.0.93 ships a BUNDLED FIPS libcrypto that aborts on
  # import cv2; the image pins opencv 4.12.0.88 to fix it. These env vars are kept
  # as harmless defensive defaults.
  OPENSSL_FORCE_FIPS_MODE: "0"
  OPENSSL_FIPS: "0"

max_retries: 0
timeout_minutes: 240

# NOTE: This is a "does it run" smoke, NOT a real training run. Data is tiny
# (prep_gsm8k_deps.yaml = 64 train / 8 test) and run_grpo.sh caps optimizer steps
# (total_training_steps=3). Full data / full training is left to the customer.
parameters:
  model_name: google/gemma-4-26B-A4B-it
  train_files: __VOL__/gsm8k/train.parquet
  val_files: __VOL__/gsm8k/test.parquet
  output_dir: __VOL__/ckpt/grpo-gemma4-26b-a4b
  total_epochs: 1
  total_training_steps: 3    # smoke: stop after a few steps

# Run the uploaded run_grpo.sh (fresh copy from code_source, not the baked /app
# one) so script fixes apply without an image rebuild. It reads the parameters
# above from $HYPERPARAMETERS_PATH.
command: |
  cd $CODE_SOURCE_PATH
  bash run_grpo.sh
